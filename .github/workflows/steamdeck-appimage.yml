name: Standalone Steam Deck AppImage installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'steamdeck/appimage/**'
      - '.github/workflows/steamdeck-appimage.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag with the verified Linux ZIP
        required: true
        type: string
      publish:
        description: Attach the tested .AppImage + .sha256 to this release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package-appimage:
    name: Build and smoke-test x86_64 standalone installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'write' || 'read' }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'artur-r2.18.1-npc-disguise-safety-20261031' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OUTPUT_NAME: Artur-Edition-R2.18.1-SteamDeck-Linux-Installer-x86_64.AppImage
    steps:
      - name: Checkout application sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate launcher source and desktop entry
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils shellcheck unzip file curl
          bash -n steamdeck/appimage/AppRun steamdeck/appimage/build.sh
          shellcheck --severity=error steamdeck/appimage/AppRun steamdeck/appimage/build.sh
          desktop-file-validate steamdeck/appimage/artur-edition.desktop

      - name: Retrieve matching verified offline Steam Deck ZIP
        run: |
          set -euo pipefail
          mkdir -p downloaded build tools
          python3 - <<'PY'
          import json, os
          with open('steamdeck/release-versions.json', encoding='utf-8') as f:
              manifest = json.load(f)
          if os.environ['RELEASE_TAG'] not in manifest:
              raise SystemExit('Release tag not in approved release-versions.json')
          if manifest[os.environ['RELEASE_TAG']]['release_version'] != 'R2.18.1':
              raise SystemExit('This workflow packages R2.18.1 only')
          PY
          gh release download "$RELEASE_TAG" --repo "$REPO" \
            --pattern 'HitmanCoop-Artur-R2.18.1-SteamDeck-Linux-Proton.zip*' \
            --dir downloaded
          cd downloaded
          sha256sum --check HitmanCoop-Artur-R2.18.1-SteamDeck-Linux-Proton.zip.sha256
          unzip -t HitmanCoop-Artur-R2.18.1-SteamDeck-Linux-Proton.zip | tail -n 1

      - name: Download and verify pinned official AppImage build tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o tools/appimagetool.AppImage \
            'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  tools/appimagetool.AppImage' | sha256sum -c -
          curl -fsSL --retry 3 -o tools/runtime-x86_64 \
            'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64'
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  tools/runtime-x86_64' | sha256sum -c -
          chmod +x tools/appimagetool.AppImage tools/runtime-x86_64

      - name: Package offline installer and test mounting/extraction
        run: |
          set -euo pipefail
          bash steamdeck/appimage/build.sh \
            downloaded/HitmanCoop-Artur-R2.18.1-SteamDeck-Linux-Proton.zip \
            tools/appimagetool.AppImage tools/runtime-x86_64 "build/$OUTPUT_NAME"
          file "build/$OUTPUT_NAME"
          test -x "build/$OUTPUT_NAME"
          APPIMAGE_EXTRACT_AND_RUN=1 "build/$OUTPUT_NAME" --status | tee build/appimage-smoke-test.txt
          grep -F 'Complete offline R2.18.1 runtime present' build/appimage-smoke-test.txt
          sha256sum "build/$OUTPUT_NAME" > "build/$OUTPUT_NAME.sha256"
          cat "build/$OUTPUT_NAME.sha256"

      - name: Upload tested AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artur-SteamDeck-Standalone-AppImage
          path: |
            build/*.AppImage
            build/*.AppImage.sha256
            build/appimage-smoke-test.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish tested standalone installer alongside existing Windows and Linux ZIPs
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$REPO" --clobber \
            "build/$OUTPUT_NAME" "build/$OUTPUT_NAME.sha256"
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name'
